services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
    volumes:
      - neo4j_data:/data
      - ./data/processed:/import

  api:
    build: .
    ports:
      - "${API_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - neo4j

volumes:
  neo4j_data:
